<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WTT Prototype — Tree Split</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark">WTT</span>
      <span class="brand-title">Tree Split Prototype</span>
    </div>
    <p class="top-note">Planungs-Prototyp v30 — Typ-Ast · BOM: Menge=Stück · Fußzeile = gleiche Spalten + sum/avg/… · Setup-Startknoten · Allowlists. Kein WP-Plugin.</p>
  </header>

  <main class="split">
    <section class="pane pane-tree" aria-label="Baum">
      <header class="pane-head">
        <h1>Baum</h1>
        <div class="pane-head-actions">
          <label class="project-switch">
            <span class="visually-hidden">Projekt</span>
            <select id="project-select" title="Projekt wechseln" aria-label="Projekt"></select>
          </label>
          <button type="button" class="btn ghost" id="btn-reset" title="Zurücksetzen">Reset</button>
        </div>
      </header>
      <div id="tree-root" class="tree" role="tree"></div>
    </section>

    <section class="pane pane-detail" aria-label="Inhalt">
      <header class="pane-head pane-head-tabs">
        <div class="tabs" role="tablist" aria-label="Rechte Ansicht">
          <button type="button" class="tab is-active" role="tab" id="tab-node" data-tab="node" aria-selected="true" aria-controls="detail">Knoten</button>
          <button type="button" class="tab" role="tab" id="tab-backend" data-tab="backend" aria-selected="false" aria-controls="detail">Backend</button>
          <button type="button" class="tab" role="tab" id="tab-frontend" data-tab="frontend" aria-selected="false" aria-controls="detail">Frontend</button>
          <button type="button" class="tab" role="tab" id="tab-form" data-tab="form" aria-selected="false" aria-controls="detail">Feld</button>
        </div>
      </header>
      <div id="detail" class="detail" role="tabpanel" aria-labelledby="tab-node">
        <p class="muted">Knoten auswählen.</p>
      </div>
    </section>
  </main>

  <script src="app.js?v=30" type="module"></script>
</body>
</html>
